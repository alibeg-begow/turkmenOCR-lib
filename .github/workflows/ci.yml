name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        # The tests never import torch or transformers, so the heavy runtime
        # dependencies are skipped to keep the job fast.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow
          python -m pip install --no-deps -e .
      - run: python -m pytest -q

  build:
    name: Build distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify bundled model files are packaged
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json",
              "processor_config.json", "model.safetensors.index.json", "modeling_turkmenocr.py",
              "modeling_turkmenocr_v2.py", "configuration_turkmenocr_v2.py", "deepencoder.py",
              "conversation.py", "LICENSE",
          ]
          missing = [n for n in required if f"turkmenocr/assets/turkmen_ocr/{n}" not in names]
          if missing:
              raise SystemExit(f"missing from wheel: {missing}")
          print(f"{wheel}: all {len(required)} bundled files present")
          EOF
      - name: Smoke-test the installed command
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-deps dist/*.whl pillow
          /tmp/smoke/bin/turkmenocr --version
          /tmp/smoke/bin/turkmenocr --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
